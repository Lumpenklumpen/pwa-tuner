<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PWA-Tuner: Plektrum in LED-Amber auf dunklem LED-Raster -->
  <defs>
    <pattern id="leds" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.2" fill="#ffb000" opacity="0.09"/>
    </pattern>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feFlood flood-color="#ffb000" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="#0a0a0a"/>
    <rect width="512" height="512" fill="url(#leds)"/>
  </g>
  <path filter="url(#glow)" fill="url(#amber)" transform="translate(121 94) scale(1.35)"
        d="M100 232 C 62 232 22 128 14 72 C 8 28 48 8 100 8 C 152 8 192 28 186 72 C 178 128 138 232 100 232 Z"/>
</svg>
